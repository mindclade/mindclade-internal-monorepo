name: required-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: .uv-version
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.71.0"
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.2"
      - uses: extractions/setup-just@v3
      - uses: bazelbuild/setup-bazelisk@v3
      - run: uv sync --all-packages --locked
      - run: just check
      - run: just protocol-check
      - run: just test-cpu
      - run: just service-check
      - run: just render-deploy
      - run: just bazel-test
      - run: just build-wheels
      - run: uv run check-wheel-contents dist/*.whl
      - run: uv run python protocols/python/wheel_smoke.py --wheel-dir dist
