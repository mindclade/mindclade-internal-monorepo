[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "mindclade-inference"
version = "0.1.0"
description = "Deterministic, integrity-preserving inference runtime for Mindclade models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Mindclade-Proprietary"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mindclade" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "mindclade-models==0.1.0",
  "torch>=2.13,<2.14",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.uv.build-backend]
module-name = "mindclade.inference"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
