[project]
name = "mindclade-workspace"
version = "0.0.0"
description = "Private Mindclade monorepo workspace"
requires-python = ">=3.12,<3.13"
classifiers = ["Private :: Do Not Upload"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["models", "training", "inference", "protocols", "workers/inference_worker"]

[tool.uv.sources]
mindclade-models = { workspace = true }
mindclade-training = { workspace = true }
mindclade-inference = { workspace = true }
mindclade-inference-worker = { workspace = true }
mindclade-protocols = { workspace = true }

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "check-wheel-contents>=0.6,<1",
  "cryptography>=46,<47",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
consider_namespace_packages = true
testpaths = [
  "models/tests",
  "models/src/mindclade/models/families/clade/cladefold/tests",
  "training/tests",
  "inference/tests",
  "workers/inference_worker/tests",
  "protocols/compatibility/tests",
  "protocols/python/tests",
  "deploy/tests",
  "tests",
]
markers = [
  "gpu: requires a CUDA accelerator",
  "distributed: requires two or more CUDA devices",
  "integration: exercises multiple components",
  "nightly: long-running qualification coverage",
  "network: requires an explicitly available external service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["protocols/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
exclude = ["protocols/generated", ".*/tests/.*"]
