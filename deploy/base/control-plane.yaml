apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  # The development store is process-local. Scale only after binding Postgres.
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: control-plane}
  template:
    metadata:
      labels: {app.kubernetes.io/name: control-plane}
    spec:
      serviceAccountName: control-plane
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control-plane
          image: us-docker.pkg.dev/mindclade-development/runtime/control-plane@sha256:1111111111111111111111111111111111111111111111111111111111111111
          imagePullPolicy: IfNotPresent
          env:
            - {name: MINDCLADE_CONTROL_PLANE_ADDRESS, value: "0.0.0.0:8081"}
            - {name: MINDCLADE_ARTIFACT_CATALOG_FILE, value: "/var/run/mindclade-catalog/catalog.json"}
            - {name: MINDCLADE_INTERNAL_IDENTITY_SECRET_FILE, value: "/var/run/mindclade-internal-auth/hmac"}
            - {name: MINDCLADE_KUBERNETES_API_SERVER, value: "https://kubernetes.default.svc"}
            - {name: MINDCLADE_KUBERNETES_TOKEN_FILE, value: "/var/run/mindclade-kubernetes/token"}
            - {name: MINDCLADE_KUBERNETES_CA_FILE, value: "/var/run/mindclade-kubernetes/ca.crt"}
            - name: MINDCLADE_RUNTIME_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: MINDCLADE_KUEUE_LOCAL_QUEUE, value: "inference"}
            - {name: MINDCLADE_WORKER_SERVICE_ACCOUNT, value: "inference-worker"}
            - {name: MINDCLADE_WORKER_TRUST_SECRET, value: "worker-trusted-public-keys"}
            - {name: MINDCLADE_WORKER_IMAGE, value: "us-docker.pkg.dev/mindclade-development/runtime/inference-worker@sha256:4444444444444444444444444444444444444444444444444444444444444444"}
            - {name: MINDCLADE_ARTIFACT_PROXY_URL, value: "http://artifact-proxy:8082"}
            - {name: MINDCLADE_ARTIFACT_VERIFY_TIMEOUT_SECONDS, value: "10"}
            - {name: MINDCLADE_STAGING_CAPABILITY_TTL_SECONDS, value: "5400"}
            - {name: MINDCLADE_CONTROL_PLANE_INTERNAL_URL, value: "http://control-plane:8081"}
            - {name: MINDCLADE_RESULT_STORAGE_CLASS, value: "premium-rwo"}
            - {name: MINDCLADE_RESULT_STORAGE_REQUEST, value: "20Gi"}
            - {name: MINDCLADE_ARTIFACT_SCRATCH_LIMIT, value: "36Gi"}
            - {name: MINDCLADE_QUEUE_DEADLINE_SECONDS, value: "900"}
            - {name: MINDCLADE_ATTEMPT_STARTUP_DEADLINE_SECONDS, value: "300"}
            - {name: MINDCLADE_ATTEMPT_ACTIVE_DEADLINE_SECONDS, value: "3600"}
            - {name: MINDCLADE_JOBSET_RECONCILE_INTERVAL_SECONDS, value: "5"}
            - {name: MINDCLADE_JOBSET_TTL_SECONDS, value: "86400"}
            - {name: MINDCLADE_KUBERNETES_LAUNCH_TIMEOUT_SECONDS, value: "10"}
            - {name: MINDCLADE_SERVING_REVISION_DIGEST, value: "sha256:4444444444444444444444444444444444444444444444444444444444444444"}
            - {name: MINDCLADE_SAMPLER_DIGEST, value: "sha256:5555555555555555555555555555555555555555555555555555555555555555"}
            - {name: MINDCLADE_SCHEDULER_SIGNING_KEY_ID, value: "scheduler-development-001"}
            - {name: MINDCLADE_SCHEDULER_PRIVATE_KEY_FILE, value: "/var/run/mindclade-private-signing/scheduler-private.pem"}
            - {name: MINDCLADE_ARTIFACT_CAPABILITY_SIGNING_KEY_ID, value: "artifact-development-001"}
            - {name: MINDCLADE_ARTIFACT_CAPABILITY_PRIVATE_KEY_FILE, value: "/var/run/mindclade-private-signing/artifact-capability-private.pem"}
          ports: [{name: http, containerPort: 8081}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: artifact-catalog, mountPath: /var/run/mindclade-catalog, readOnly: true}
            - {name: internal-identity, mountPath: /var/run/mindclade-internal-auth, readOnly: true}
            - {name: kubernetes-api, mountPath: /var/run/mindclade-kubernetes, readOnly: true}
            - {name: private-signing-keys, mountPath: /var/run/mindclade-private-signing, readOnly: true}
      volumes:
        - name: artifact-catalog
          configMap: {name: artifact-catalog-development, defaultMode: 0444}
        - name: internal-identity
          secret: {secretName: internal-identity-hmac, defaultMode: 0440}
        - name: kubernetes-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
        - name: private-signing-keys
          secret: {secretName: control-plane-signing-private-keys, defaultMode: 0440}
