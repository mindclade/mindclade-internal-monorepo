apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-attempt-launcher
rules:
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "persistentvolumeclaims"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-attempt-launcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-attempt-launcher
subjects:
  - kind: ServiceAccount
    name: control-plane
