apiVersion: v1
kind: Service
metadata: {name: control-plane, labels: {app.kubernetes.io/name: control-plane}}
spec:
  selector: {app.kubernetes.io/name: control-plane}
  ports: [{name: http, port: 8081, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: runtime-gateway, labels: {app.kubernetes.io/name: runtime-gateway}}
spec:
  selector: {app.kubernetes.io/name: runtime-gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: artifact-proxy}
spec:
  selector: {app.kubernetes.io/name: artifact-proxy}
  ports: [{name: http, port: 8082, targetPort: http}]
