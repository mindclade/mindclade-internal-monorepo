apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: control-plane}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: control-plane}}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: runtime-gateway}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: runtime-gateway}}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
