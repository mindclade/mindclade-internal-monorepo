apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mindclade-model-runtime
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - control-plane-rbac.yaml
  - artifact-catalog.yaml
  - artifact-store.yaml
  - control-plane.yaml
  - runtime-gateway.yaml
  - artifact-proxy.yaml
  - services.yaml
  - network-policies.yaml
  - service-monitors.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: mindclade-model-runtime
